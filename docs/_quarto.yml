project:
  type: website

website:
  title: netzero-metrics
  favicon: images/favicon.png
  navbar:
    logo: images/logo.png
    left:
      - app-user-guide.qmd
      - reference-data.qmd
      - demo-outputs.qmd
      # - examples.md # TODO: update this
      - models.qmd
      - text: "Calcs"
        href: reference/calcs.qmd

      - text: "Examples"
        id: examples
        href: examples/index.py


    right:
      - icon: github
        href: https://github.com/maxfordham/netzero-metrics
        aria-label: GitHub


  sidebar:
    - id: examples
      contents: 
        - examples/index.py
        - examples/mixed-use.py


quartodoc:
  # the name used to import the package you want to create reference docs for
  package: netzero_metrics
  parser: google

  sections:
    - title: Some functions
      contents:
        # the functions being documented in the package.
        # you can refer to anything: class methods, modules, etc..
        - calcs
        - models

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true