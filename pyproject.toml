[project]
authors = [{ name = "jgunstone", email = "j.gunstone@maxfordham.com" }]
name = "netzero-metrics"
description = "Calculations for net zero metrics"
requires-python = ">= 3.11"
dynamic = ["version"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.version]
source = "vcs"
# raw-options = { root = "../.." }

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
ipyautoui = ">=0.7.25"
netzero_metrics = { path = ".", editable = true }
netzero-metrics-reference-data = ">=0.3.0,<0.4"
# netzero-metrics-reference-data = { git = "https://github.com/maxfordham/netzero-metrics-reference-data.git" }

[tool.pixi.environments]
tests = { features = ["tests"] }

[tool.pixi.feature.tests.pypi-dependencies]
pytest-examples = ">=0.0.15,<0.0.16"
mdpd = ">=0.2.1,<0.3"
jupyterlab-quarto = ">=0.3.5,<0.4"

[tool.pixi.feature.tests.dependencies]
quarto = "<1.7"
quartodoc = "*"
xlsxwriter = ">=1.4.3,<2"
jupyterlab = ">=4.0.0,<5"
ruff = ">=0.14.3,<0.15"
jupytext = ">=1.18.1,<2"
jupyterlab-search-replace = ">=1.1.0,<2"

[tool.pixi.tasks]

[tool.pixi.feature.tests.tasks]
tests = "pytest"
update-examples = "pytest tests/test_examples.py --update-examples"
quartodoc = {cmd = "quartodoc build", cwd = "docs"}
docs-no-update = { cmd = "quarto render . ", cwd = "docs" }
docs = { depends-on=["quartodoc", "docs-no-update"] }
open-docs = {cmd="/mnt/c/windows/explorer.exe index.html", cwd="docs/_site"} # this will only work on WSL
docs-open = { depends-on=["docs", "open-docs"] }
jlab = "jupyter lab"

[tool.pixi.dependencies]
frictionless = ">=5.0.0,<6"
pandas = ">=2.2.3,<3"
polars = ">=1.0.0,<2"
duckdb = ">=1.0.0,<2"
numpy = ">=2.2.3,<3"
ipydatagrid = ">=1.3.0,<1.4.0"
pydantic = ">=2.10.6,<3"
pandera = ">=0.24"
pyarrow = ">=19.0.0,<20"
ipywidgets = ">=8.1.5,<9"
great_tables = ">=0.16.1,<0.17"
altair = ">=5.5.0,<6"
vl-convert-python = ">=1.7.0,<2"
tabulate = ">=0.9.0,<0.10"
palettable = ">=3.3.0,<4"
erdantic = ">=1.1.0.post1,<2"
pip = ">=23.0.1,<24"


[tool.pytest.ini_options]
filterwarnings = [
    "ignore:((.|\n)*)Sentinel is not a public part of the traitlets API((.|\n)*)",
    "ignore::DeprecationWarning:traittypes",
    "ignore:Using extra keyword arguments on `Field` is deprecated and will be removed.*",
    # ^ ipyautoui warning. Remove once fixed in ipyautoui
]
